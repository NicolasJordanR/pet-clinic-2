name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main 
      - 'releases/*' 
      - 'feat-**' 

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          args: --property,project.open.type=Maven  
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1445300995 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
